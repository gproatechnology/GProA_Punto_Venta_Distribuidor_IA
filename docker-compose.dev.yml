# GProA - Docker Compose Desarrollo
# Uso: docker-compose -f docker-compose.dev.yml up -d

services:
  # MongoDB Service
  mongodb:
    image: mongo:7.0
    container_name: gproa-mongodb-dev
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: gproa_punto_venta
    volumes:
      - mongodb_data:/data/db
    networks:
      - gproa-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gproa-network:
    driver: bridge

volumes:
  mongodb_data:
    name: gproa-mongodb-data